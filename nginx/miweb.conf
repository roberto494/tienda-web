server {
    # Solo accesible desde este equipo (no desde la red)
    listen 127.0.0.1:8080;
    server_name localhost;
    server_tokens off;

    access_log /var/log/nginx/miweb_access.log combined;
    access_log /var/log/nginx/miweb_seguridad.jsonl miweb_json;
    error_log /var/log/nginx/miweb_error.log warn;

    # 403 generado por Nginx: la petición no llega a la tienda
    location = /zona-privada { return 403; }

    # Todo lo demás se reenvía a la tienda (contenedor Docker en 8081)
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
