# Ocultar versión de Apache y del sistema
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Cabeceras de seguridad
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
